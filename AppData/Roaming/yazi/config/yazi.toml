	{ url = "*.yaml", run = "code" },
	{ url = "*.yml", run = "code" },
	{ url = "*.lua", run = "code" },
	{ url = "*.py", run = "code" },
	{ url = "*.js", run = "code" },
	{ url = "*.ts", run = "code" },
	{ url = "*.rs", run = "code" },
	{ url = "*.go", run = "code" },
	{ url = "*.c", run = "code" },
	{ url = "*.cpp", run = "code" },
