[manager]
ratio = [1, 2, 5]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[preview]
tab_size = 2
max_width = 600
max_height = 900
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
    { run = 'nvim %*', desc = "nvim", block = true, for = "windows" },
    { run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
    { run = 'code %*', orphan = true, desc = "code", for = "windows" },
    { run = 'code -w %*', block = true, desc = "code (block)", for = "windows" },
]
open = [
    { run = 'xdg-open "$1"', desc = "Open", for = "linux" },
    { run = 'open "$@"', desc = "Open", for = "macos" },
    { run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
]
reveal = [
    { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "linux" },
    { run = 'open -R "$1"', desc = "Reveal", for = "macos" },
    { run = 'explorer /select,"%1"', orphan = true, desc = "Reveal", for = "windows" },
]
extract = [
    { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
    { run = 'ya pub extract --list %*', desc = "Extract here", for = "windows" },
]
play = [
    { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
    { run = 'mpv --force-window %*', orphan = true, for = "windows" },
]

[[plugin.prepend_fetchers]]
id    = "mime"
group = "mime"
if    = "!(mime|dummy)"
name  = "*"
run   = "mime-ext"
prio  = "high"

[open]
prepend_rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "application/toml", use = "edit" },
	{ mime = "application/x-yaml", use = "edit" },
	{ mime = "application/javascript", use = "edit" },
	{ mime = "application/typescript", use = "edit" },
	{ url = "*.txt", use = "edit" },
	{ url = "*.md", use = "edit" },
	{ url = "*.json", use = "edit" },
	{ url = "*.toml", use = "edit" },
	{ url = "*.yaml", use = "edit" },
	{ url = "*.yml", use = "edit" },
	{ url = "*.lua", use = "edit" },
	{ url = "*.py", use = "edit" },
	{ url = "*.js", use = "edit" },
	{ url = "*.ts", use = "edit" },
	{ url = "*.rs", use = "edit" },
	{ url = "*.go", use = "edit" },
	{ url = "*.c", use = "edit" },
	{ url = "*.cpp", use = "edit" },
	{ url = "*.h", use = "edit" },
	{ url = "*.sh", use = "edit" },
	{ url = "*.ps1", use = "edit" },
	{ url = "*.bat", use = "edit" },
	{ url = "*.cmd", use = "edit" },
	{ url = "*.html", use = "edit" },
	{ url = "*.css", use = "edit" },
]

append_rules = [
	{ url = "*", use = "edit" },
]

[plugin]
prepend_previewers = [
	{ mime = "text/*", run = "code" },
	{ mime = "application/json", run = "code" },
